<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020814">
<title>JARVIS · Privacy Policy</title>
<style>
:root{--bg:#020814;--panel:rgba(8,26,52,.72);--line:rgba(0,229,255,.22);--cyan:#00e5ff;--text:#dff7ff;--muted:#8fb3c4;--warn:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1000px 600px at 50% -10%,#0a2a52,var(--bg) 60%) fixed;color:var(--text);font:16px/1.55 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;padding:0 16px 40px}
.wrap{max-width:760px;margin:0 auto}
header{padding:22px 0 8px}
.back{display:inline-block;color:var(--cyan);text-decoration:none;font-size:14px;margin-bottom:14px}
h1{font-size:26px;letter-spacing:.06em;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.45)}
.meta{color:var(--muted);font-size:14px;margin-top:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.box.warn{border-color:rgba(255,209,102,.5)}
h2{font-size:17px;color:var(--cyan);margin:26px 0 8px;letter-spacing:.02em}
p{margin:8px 0;color:var(--text)}
ul{margin:8px 0 8px 20px}
li{margin:5px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--cyan);background:rgba(0,229,255,.06)}
.todo{color:var(--warn);font-weight:600}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" href="index.html">← Back to JARVIS</a>
  <h1>JARVIS Privacy Policy</h1>
