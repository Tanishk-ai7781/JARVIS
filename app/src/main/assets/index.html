<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020814">
<meta name="description" content="JARVIS — a personal AI assistant founded by Mr. Tanishk.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23020814' stroke='%2300e5ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020814; --bg2:#06142b; --panel:rgba(8,26,52,.72); --line:rgba(0,229,255,.22);
  --cyan:#00e5ff; --cyan2:#4df0ff; --text:#dff7ff; --muted:#7fa6b8; --user:#0a3a63; --danger:#ff5d73; --ok:#3dffa8;
  --display:'Orbitron','Segoe UI',system-ui,sans-serif; --body:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#0a2a52 0%,var(--bg) 60%) fixed;color:var(--text);font-family:var(--body);font-size:17px;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 8px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:20px;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.55)}
.brand small{display:block;font-family:var(--body);font-weight:500;letter-spacing:.14em;font-size:11px;color:var(--muted);text-shadow:none;margin-top:2px}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,229,255,.05);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px currentColor;color:var(--danger)}
.chip.on .dot{background:var(--ok);color:var(--ok)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--cyan);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer}
.iconbtn:active{background:rgba(0,229,255,.12)}
