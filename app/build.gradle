plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def hasKeystore = System.getenv("KEYSTORE_FILE") != null && !System.getenv("KEYSTORE_FILE").isEmpty()

android {
    namespace 'com.tanishk.jarvis'
    compileSdk 36

    defaultConfig {
        applicationId "com.tanishk.jarvis"
        minSdk 26
        targetSdk 36
        // Play needs a bigger versionCode on every upload; GitHub's run number only ever grows.
        versionCode = runNumber
        versionName = "1.0." + runNumber
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}