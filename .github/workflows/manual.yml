
name: JARVIS Android AAB Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Keystore for Release
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias jarvis-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvispassword -keypass jarvispassword \
            -dname "CN=Mr Tanishk, OU=JARVIS AI, O=JARVIS, L=Patna, S=Bihar, C=IN"

      - name: Build Android App Bundle
        run: |
          gradle :app:bundleRelease \
            -Pandroid.injected.signing.store.file=../release.keystore \
            -Pandroid.injected.signing.store.password=jarvispassword \
            -Pandroid.injected.signing.key.alias=jarvis-key \
            -Pandroid.injected.signing.key.password=jarvispassword

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
