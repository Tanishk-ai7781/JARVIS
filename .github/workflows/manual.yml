name: JARVIS Android AAB Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix All Project Files & Resources
        run: |
          if [ -f "app/build. gradle" ]; then
            mv "app/build. gradle" "app/build.gradle"
          fi

          # Copy index.html into Android assets if available
          mkdir -p app/src/main/assets
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          fi

          # Clean AndroidManifest without missing @mipmap/ic_launcher reference
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mrtanishk.jarvis'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mrtanishk.jarvis"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Generate Keystore for Release
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias jarvis-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvispassword -keypass jarvispassword \
            -dname "CN=Mr Tanishk, OU=JARVIS AI, O=JARVIS, L=Patna, S=Bihar, C=IN"

      - name: Build Android App Bundle (.aab)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew :app:bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=jarvispassword \
            -Pandroid.injected.signing.key.alias=jarvis-key \
            -Pandroid.injected.signing.key.password=jarvispassword

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
