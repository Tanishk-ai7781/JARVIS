name: JARVIS Android AAB Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # YEH STEP "build. gradle" KI SPACE KO FIX KAREGA AUR CLEAN SETUP BANA DEGA
      - name: Fix File Names & Gradle Config
        run: |
          if [ -f "app/build. gradle" ]; then
            mv "app/build. gradle" "app/build.gradle"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mrtanishk.jarvis'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mrtanishk.jarvis"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Generate Keystore for Release
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias jarvis-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvispassword -keypass jarvispassword \
            -dname "CN=Mr Tanishk, OU=JARVIS AI, O=JARVIS, L=Patna, S=Bihar, C=IN"

      - name: Build Android App Bundle (.aab)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew :app:bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=jarvispassword \
            -Pandroid.injected.signing.key.alias=jarvis-key \
            -Pandroid.injected.signing.key.password=jarvispassword

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
