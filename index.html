<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020814">
<meta name="description" content="JARVIS — a personal AI assistant founded by Mr. Tanishk.">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23020814' stroke='%2300e5ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020814; --bg2:#06142b; --panel:rgba(8,26,52,.72); --line:rgba(0,229,255,.22);
  --cyan:#00e5ff; --cyan2:#4df0ff; --text:#dff7ff; --muted:#7fa6b8; --user:#0a3a63; --danger:#ff5d73; --ok:#3dffa8;
  --display:'Orbitron','Segoe UI',system-ui,sans-serif; --body:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#0a2a52 0%,var(--bg) 60%) fixed;color:var(--text);font-family:var(--body);font-size:17px;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 8px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:20px;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.55)}
.brand small{display:block;font-family:var(--body);font-weight:500;letter-spacing:.14em;font-size:11px;color:var(--muted);text-shadow:none;margin-top:2px}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,229,255,.05);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px currentColor;color:var(--danger)}
.chip.on .dot{background:var(--ok);color:var(--ok)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--cyan);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer}
.iconbtn:active{background:rgba(0,229,255,.12)}

/* Orb */
.stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;flex:none}
.orb{position:relative;width:150px;height:150px;transition:transform .4s}
.orb .core{position:absolute;inset:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff8ff,var(--cyan) 45%,#0077a8 100%);box-shadow:0 0 36px 8px rgba(0,229,255,.55),inset 0 0 18px rgba(255,255,255,.4);animation:breathe 3.6s ease-in-out infinite}
.orb .ring{position:absolute;border-radius:50%;border:2px solid transparent}
.orb .r1{inset:0;border-top-color:var(--cyan);border-bottom-color:rgba(0,229,255,.25);animation:spin 7s linear infinite}
.orb .r2{inset:14px;border-left-color:var(--cyan2);border-right-color:rgba(77,240,255,.2);animation:spin 5s linear infinite reverse}
.orb .r3{inset:28px;border:1px dashed rgba(0,229,255,.45);animation:spin 16s linear infinite}
.orb.listening .core{animation:pulse .9s ease-in-out infinite;filter:hue-rotate(-25deg)}
.orb.speaking .core{animation:talk .5s ease-in-out infinite}
.orb.listening .r1,.orb.speaking .r1{animation-duration:2.2s}
.state{font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--muted);margin-top:8px;text-transform:uppercase;min-height:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 48px 12px rgba(0,229,255,.65),inset 0 0 18px rgba(255,255,255,.4)}}
@keyframes pulse{50%{transform:scale(1.22)}}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}60%{transform:scale(.96)}}

/* Chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding:10px 2px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease-out}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#0b4a7d,var(--user));border:1px solid rgba(0,229,255,.3);border-top-right-radius:4px}
.msg.err{border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.08)}
.tag{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px;opacity:.85}
.retry{margin-top:8px;background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* Quick actions */
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;flex:none;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;background:rgba(0,229,255,.06);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer}
.quick button:active{background:rgba(0,229,255,.18)}

/* Composer */
form{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(8px);flex:none}
input[type=text]{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;padding:8px 6px}
input::placeholder{color:var(--muted)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,229,255,.08);color:var(--cyan);font-size:18px;cursor:pointer;display:grid;place-items:center}
.btn.mic.active{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 0 16px rgba(255,93,115,.7)}
.btn.send{background:var(--cyan);color:#001018;border-color:var(--cyan);font-weight:700}
.btn:disabled{opacity:.45}
footer{text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:8px 0 10px;flex:none}
footer b{color:var(--cyan);font-weight:600}
@media (max-height:640px){.orb{width:100px;height:100px}.orb .core{inset:32px}.orb .r2{inset:9px}.orb .r3{inset:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">JARVIS<small>PERSONAL AI ASSISTANT</small></div>
    <div class="chips">
      <div class="chip" id="net"><span class="dot"></span><span id="netText">Offline</span></div>
      <button class="iconbtn" id="speakToggle" title="Voice replies on/off" aria-label="Toggle voice replies">🔊</button>
      <button class="iconbtn" id="clearBtn" title="Clear chat" aria-label="Clear chat">🗑</button>
    </div>
  </header>

  <div class="stage">
    <div class="orb" id="orb"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
    <div class="state" id="state">Standing by</div>
  </div>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="quick" id="quick">
    <button data-q="what time is it">🕒 Time</button>
    <button data-q="what is today's date">📅 Date</button>
    <button data-q="open youtube">▶ YouTube</button>
    <button data-q="open google">🔎 Google</button>
    <button data-q="open gmail">✉ Gmail</button>
    <button data-q="open maps">📍 Maps</button>
  </div>

  <form id="form" autocomplete="off">
    <button type="button" class="btn mic" id="mic" aria-label="Voice input">🎤</button>
    <input type="text" id="input" placeholder="Ask JARVIS anything…" aria-label="Message">
    <button type="submit" class="btn send" id="send" aria-label="Send">➤</button>
  </form>

  <footer>JARVIS is owned and founded by <b>Mr. Tanishk</b></footer>
</div>

<script>
(function(){
  /* ---- Config ----
     Set API_URL to your deployed backend. It must accept POST JSON {message, history}
     and return JSON {reply}. Keep AI keys on the server, never in this file. */
  var API_URL = "";
  var TIMEOUT_MS = 25000;
  var STORE = "jarvis_chat_v1", PREF = "jarvis_speak_v1";

  var $ = function(id){return document.getElementById(id)};
  var chat=$("chat"), orb=$("orb"), stateEl=$("state"), input=$("input"), form=$("form"),
      micBtn=$("mic"), sendBtn=$("send"), net=$("net"), netText=$("netText"), speakBtn=$("speakToggle");
  var history=[], speakOn=true, recog=null, listening=false, busy=false;

  try{ speakOn = localStorage.getItem(PREF)!=="0"; }catch(e){}
  speakBtn.textContent = speakOn ? "🔊" : "🔇";

  function setState(mode,label){
    orb.className="orb"+(mode?" "+mode:"");
    stateEl.textContent=label||"Standing by";
  }
  function save(){ try{localStorage.setItem(STORE,JSON.stringify(history.slice(-60)))}catch(e){} }
  function scroll(){ chat.scrollTop=chat.scrollHeight; }

  function addMsg(role,text,opts){
    opts=opts||{};
    var d=document.createElement("div");
    d.className="msg "+role+(opts.err?" err":"");
    if(role==="ai"){ var t=document.createElement("span"); t.className="tag"; t.textContent="JARVIS · AI assistant"; d.appendChild(t); }
    var p=document.createElement("span"); p.textContent=text; d.appendChild(p);
    chat.appendChild(d); scroll();
    if(!opts.noSave){ history.push({role:role,text:text}); save(); }
    return d;
  }
  function addTyping(){
    var d=document.createElement("div"); d.className="msg ai";
    d.innerHTML='<span class="tag">JARVIS · AI assistant</span><span class="typing"><i></i><i></i><i></i></span>';
    chat.appendChild(d); scroll(); return d;
  }

  function speak(text){
    if(!speakOn || !("speechSynthesis" in window)) { setState("", "Standing by"); return; }
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text); u.rate=1; u.pitch=.95;
      u.onstart=function(){setState("speaking","Speaking")};
      u.onend=u.onerror=function(){setState("","Standing by")};
      speechSynthesis.speak(u);
    }catch(e){ setState("","Standing by"); }
  }

  function reply(text,opts){ addMsg("ai",text,opts); speak(text); }

  function openSite(url,name){ reply("Opening "+name+"."); setTimeout(function(){window.open(url,"_blank","noopener")},400); }

  /* Local commands (work offline) */
  function localCommand(q){
    var s=q.toLowerCase();
    if(/\b(hello|hi|hey)\b.*jarvis|^(hello|hi|hey)\b/.test(s)){ reply("Hello. JARVIS is online and ready."); return true; }
    if(/time/.test(s)&&/(what|tell|current)/.test(s)){ reply("It is "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"."); return true; }
    if(/\b(date|day)\b/.test(s)&&/(what|today|tell)/.test(s)){ reply("Today is "+new Date().toLocaleDateString([], {weekday:"long",year:"numeric",month:"long",day:"numeric"})+"."); return true; }
    if(/open youtube/.test(s)){ openSite("https://www.youtube.com","YouTube"); return true; }
    if(/open google/.test(s)){ openSite("https://www.google.com","Google"); return true; }
    if(/open (gmail|mail)/.test(s)){ openSite("https://mail.google.com","Gmail"); return true; }
    if(/open maps/.test(s)){ openSite("https://maps.google.com","Maps"); return true; }
    if(/who (made|created|founded|owns)|your (founder|owner)/.test(s)){ reply("JARVIS is owned and founded by Mr. Tanishk."); return true; }
    return false;
  }

  /* Online AI via backend */
  function askBackend(q){
    if(!API_URL){
      reply("The online AI service isn't connected yet, so I can only run basic commands right now: time, date, and opening YouTube, Google, Gmail or Maps.",{err:true});
      return Promise.resolve();
    }
    if(!navigator.onLine){
      reply("You're offline. I can still run basic commands, but AI answers need an internet connection.",{err:true});
      return Promise.resolve();
    }
    var typing=addTyping(); setState("", "Thinking"); busy=true; sendBtn.disabled=true;
    var ctl=new AbortController(); var timer=setTimeout(function(){ctl.abort()},TIMEOUT_MS);
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q,history:history.slice(-12)}),signal:ctl.signal})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ typing.remove(); if(!j||!j.reply) throw new Error("Empty reply"); reply(String(j.reply)); })
    .catch(function(e){
      typing.remove();
      var why = e.name==="AbortError" ? "The server took too long to respond." :
                /^HTTP 5/.test(e.message) ? "The server had an internal error ("+e.message+")." :
                /^HTTP 4/.test(e.message) ? "The server rejected the request ("+e.message+")." :
                "I couldn't reach the server. Check your connection.";
      var d=addMsg("ai",why,{err:true,noSave:true});
      var b=document.createElement("button"); b.className="retry"; b.textContent="Retry"; b.type="button";
      b.onclick=function(){ d.remove(); askBackend(q); };
      d.appendChild(b); setState("","Standing by");
    })
    .then(function(){ clearTimeout(timer); busy=false; sendBtn.disabled=false; });
  }

  function handle(q){
    q=(q||"").trim(); if(!q||busy) return;
    addMsg("user",q);
    if(!localCommand(q)) askBackend(q);
  }

  /* Voice input */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function stopListen(){
    var was=listening; listening=false; micBtn.classList.remove("active");
    if(recog){try{recog.stop()}catch(e){}}
    if(was && window.AndroidBridge){try{AndroidBridge.stopListening()}catch(e){}}
    setState("","Standing by");
  }
  /* Inside the Android app, the built-in browser can't do speech recognition,
     so the app provides it natively through AndroidBridge. */
  window.__onNativeSpeech=function(t){ stopListen(); handle(t); };
  window.__onNativeError=function(code){
    stopListen();
    var m = code==="denied" ? "Microphone permission is blocked. Allow it in Android Settings → Apps → JARVIS → Permissions." :
            code==="unavailable" ? "Speech recognition isn't available on this phone." :
            (code===6||code===7) ? "I didn't catch that. Tap the mic and try again." :
            (code===2||code===4||code===5) ? "Speech recognition needs an internet connection." :
            "Microphone error ("+code+").";
    addMsg("ai",m,{err:true,noSave:true});
  };
  function startListen(){
    if(window.AndroidBridge){
      try{ speechSynthesis.cancel(); }catch(e){}
      listening=true; micBtn.classList.add("active"); setState("listening","Listening");
      AndroidBridge.startListening(); return;
    }
    if(!SR){ addMsg("ai","Voice input isn't supported in this browser. You can type instead.",{err:true,noSave:true}); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    recog=new SR(); recog.lang="en-IN"; recog.interimResults=false; recog.maxAlternatives=1;
    recog.onstart=function(){listening=true;micBtn.classList.add("active");setState("listening","Listening")};
    recog.onresult=function(ev){ var t=ev.results[0][0].transcript; stopListen(); handle(t); };
    recog.onerror=function(ev){
      stopListen();
      var m = ev.error==="not-allowed"||ev.error==="service-not-allowed" ? "Microphone permission is blocked. Allow microphone access in your browser or app settings." :
              ev.error==="no-speech" ? "I didn't hear anything. Tap the mic and try again." :
              ev.error==="network" ? "Speech recognition needs an internet connection." :
              "Microphone error: "+ev.error;
      addMsg("ai",m,{err:true,noSave:true});
    };
    recog.onend=function(){ if(listening) stopListen(); };
    try{ recog.start(); }catch(e){ stopListen(); }
  }
  micBtn.addEventListener("click",function(){ listening ? stopListen() : startListen(); });

  /* Wiring */
  form.addEventListener("submit",function(e){ e.preventDefault(); var v=input.value; input.value=""; handle(v); });
  $("quick").addEventListener("click",function(e){ var q=e.target.getAttribute&&e.target.getAttribute("data-q"); if(q) handle(q); });
  speakBtn.addEventListener("click",function(){
    speakOn=!speakOn; speakBtn.textContent=speakOn?"🔊":"🔇";
    try{localStorage.setItem(PREF,speakOn?"1":"0")}catch(e){}
    if(!speakOn){try{speechSynthesis.cancel()}catch(e){} setState("","Standing by");}
  });
  $("clearBtn").addEventListener("click",function(){
    if(!confirm("Clear this conversation?")) return;
    history=[]; save(); chat.innerHTML=""; greet();
  });
  function updateNet(){
    var on=navigator.onLine; net.classList.toggle("on",on);
    netText.textContent = !on ? "Offline" : (API_URL ? "Online" : "Basic mode");
  }
  window.addEventListener("online",updateNet); window.addEventListener("offline",updateNet); updateNet();

  function greet(){
    addMsg("ai","Good to see you. I'm JARVIS. Type a message or tap the microphone.",{noSave:true});
  }
  try{ history=JSON.parse(localStorage.getItem(STORE)||"[]"); }catch(e){ history=[]; }
  if(history.length){ history.forEach(function(m){ addMsg(m.role,m.text,{noSave:true}); }); }
  else greet();
})();
</script>
</body>
</html>
