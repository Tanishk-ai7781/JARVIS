

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020814">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020814;color:#80eaff;
 font-family:Arial,sans-serif;min-height:100vh;
 text-align:center;overflow-x:hidden;
 background-image:radial-gradient(ellipse at center,#09223a 0%,#020814 72%);
}
header{padding:22px 10px 8px;letter-spacing:5px;font-size:30px;font-weight:bold}
.sub{font-size:11px;letter-spacing:4px;color:#438da9}
.status{margin:22px auto 10px;font-size:12px;letter-spacing:3px}
#state{color:#60ffbd}
.hud{
 width:250px;height:250px;margin:28px auto;
 border:2px solid #168ab5;border-radius:50%;
 display:grid;place-items:center;position:relative;
 box-shadow:0 0 25px #007eae55,inset 0 0 30px #007eae33;
}
.hud:before,.hud:after{
 content:"";position:absolute;border:1px dashed #2acfff;
 border-radius:50%;inset:13px;animation:spin 12s linear infinite;
}
.hud:after{inset:31px;border-style:solid;animation-direction:reverse;animation-duration:8s}
.core{
 width:105px;height:105px;border-radius:50%;
 background:radial-gradient(circle,#a5faff,#0587c6 45%,#031629 72%);
 box-shadow:0 0 32px #00cfff;animation:pulse 2s infinite;
}
.hud.listening{box-shadow:0 0 50px #00cfff}
.hud.listening .core{animation:pulse .5s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.5)}}
button{
 background:#06283c;color:#80eaff;border:1px solid #16bde9;
 border-radius:12px;padding:14px 18px;font-size:15px;
 margin:6px;cursor:pointer;box-shadow:0 0 12px #007b9a33;
}
button:active{background:#105271}
#talk{min-width:175px;font-weight:bold}
input{
 width:min(85%,350px);padding:14px;border-radius:10px;
 border:1px solid #168ab5;background:#041322;color:white;font-size:15px;
}
#reply{padding:15px;min-height:55px;color:#d5faff}
.panel{
 border:1px solid #12516a;border-radius:14px;margin:16px auto;
 padding:16px;width:min(92%,440px);background:#041322aa;
}
h3{font-size:13px;letter-spacing:3px}
.small{font-size:12px;color:#7a9dac;line-height:1.7}
footer{padding:18px;color:#527e91;font-size:11px}
</style>
</head>
<body>
<header>J.A.R.V.I.S.</header>
<div class="sub">PERSONAL AI INTERFACE</div>
<div class="status">SYSTEM STATUS: <span id="state">ONLINE</span></div>

<div class="hud" id="hud"><div class="core"></div></div>

<div id="reply" aria-live="polite">Hello! I am ready, boss.</div>

<button id="talk" onclick="listen()">🎙 ACTIVATE VOICE</button>
<button onclick="stopVoice()">■ STOP</button>

<div class="panel">
<h3>TEXT COMMAND</h3>
<form id="commandForm">
<input id="command" placeholder="Type: open YouTube" autocomplete="off">
<br><button type="submit">EXECUTE COMMAND ↗</button>
</form>
</div>

<div class="panel">
<h3>QUICK LAUNCH</h3>
<button onclick="runCommand('open YouTube')">▶ YouTube</button>
<button onclick="runCommand('open Google')">⌕ Google</button>
<button onclick="runCommand('open Gmail')">✉ Gmail</button>
<button onclick="runCommand('open Maps')">◎ Maps</button>
<button onclick="runCommand('what time is it')">◷ Time</button>
</div>

<div class="panel">
<h3>AVAILABLE COMMANDS</h3>
<div class="small">
“Open YouTube”<br>
“Open Google”<br>
“Open Gmail”<br>
“Open Maps”<br>
“What time is it”<br>
“Hello Jarvis”
</div>
</div>

<footer>JARVIS AI · BROWSER EDITION<br>Microphone access requires permission.</footer>

<script>
const reply = document.getElementById('reply');
const state = document.getElementById('state');
const hud = document.getElementById('hud');
const command = document.getElementById('command');

function speak(text){
 reply.textContent = text;
 if ('speechSynthesis' in window){
   speechSynthesis.cancel();
   const msg = new SpeechSynthesisUtterance(text);
   msg.lang = 'en-IN';
   msg.rate = 1;
   speechSynthesis.speak(msg);
 }
}

function runCommand(raw){
 const c = raw.toLowerCase().trim();
 if(!c) return;

 if(c.includes('time')){
   speak('The time is ' + new Date().toLocaleTimeString());
   return;
 }
 if(c.includes('hello') || c.includes('hey jarvis')){
   speak('Hello boss. All systems are ready.');
   return;
 }

 const sites = {
   'youtube':'https://www.youtube.com/',
   'google':'https://www.google.com/',
   'gmail':'https://mail.google.com/',
   'maps':'https://maps.google.com/'
 };

 for(const name in sites){
   if(c.includes(name) && (c.includes('open') || c === name)){
     speak('Opening ' + name);
     window.open(sites[name], '_blank', 'noopener');
     return;
   }
 }
 speak('Command not recognised. Try open YouTube or open Google.');
}

document.getElementById('commandForm').addEventListener('submit',e=>{
 e.preventDefault();
 runCommand(command.value);
 command.value='';
});

let recognition;
let listening = false;
const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

function listen(){
 if(!SpeechRecognition){
   speak('Voice recognition is not supported in this browser. Try Chrome.');
   return;
 }
 if(listening) return;
 recognition = new SpeechRecognition();
 recognition.lang = 'en-IN';
 recognition.interimResults = false;
 recognition.continuous = false;

 recognition.onstart = ()=>{
   listening = true;
   hud.classList.add('listening');
   state.textContent = 'LISTENING';
   reply.textContent = 'Listening... Speak now.';
 };
 recognition.onresult = e=>{
   const words = e.results[0][0].transcript;
   command.value = words;
   runCommand(words);
 };
 recognition.onerror = ()=>{
   reply.textContent = 'Could not hear you. Check microphone permission and try again.';
 };
 recognition.onend = ()=>{
   listening = false;
   hud.classList.remove('listening');
   state.textContent = 'ONLINE';
 };
 try{recognition.start();}
 catch(e){speak('Please wait and try again.');}
}

function stopVoice(){
 if(recognition) recognition.abort();
 if('speechSynthesis' in window) speechSynthesis.cancel();
 listening = false;
 hud.classList.remove('listening');
 state.textContent = 'ONLINE';
 reply.textContent = 'Voice stopped.';
}
</script>
</body>
</html>
